  <title id="logoTitle">District VIII</title>

  <style>
    .logo-mark {
      fill: #ffffff;
      fill-rule: evenodd;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: logo-enter 850ms cubic-bezier(.2,.75,.25,1) 120ms forwards;
    }

    @keyframes logo-enter {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(.97);
      }

      65% {
        opacity: 1;
        transform: translateY(-2px) scale(1.005);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-mark {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>

